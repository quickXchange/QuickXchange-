        refreshedAt: { type: string, format: date-time }
    ProviderFreshness:
      type: object
      description: >-
        Product-specific upstream freshness. Swap reflects the 1Forge fiat-rate
        cache used for manual quotes. Convert reflects the Quickex instrument
        catalog refresh that gates executable routes.
      required: [state, syncing]
      properties:
        state:
          type: string
          enum: [healthy, stale, unavailable, syncing]
        syncing: { type: boolean }
        lastSucceededAt: { type: string }
        lastFailedAt: { type: string }
    AdminSummary:
      type: object
      required: [product, from, to, totalOrders, pendingOrders, completedOrders, failedCancelledOrders, totalCustomers, totalUsers, completionRate, averageCompletionTimeMinutes, averageOrderValueUsd, topPaymentMethods, topCurrencies, topTradingPairs, dailySeries, recentActivity, valuation, operationalHealth]
      properties:
        product: { type: string, enum: [swap, convert] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totalOrders: { type: number, minimum: 0, multipleOf: 1 }
        pendingOrders: { type: number, minimum: 0, multipleOf: 1 }
        completedOrders: { type: number, minimum: 0, multipleOf: 1 }
        failedCancelledOrders: { type: number, minimum: 0, multipleOf: 1 }
        totalCustomers: { type: number, minimum: 0, multipleOf: 1 }
        totalUsers: { type: number, minimum: 0, multipleOf: 1 }
        completionRate: { type: number, minimum: 0, maximum: 100 }
        averageCompletionTimeMinutes: { type: ["number", "null"], minimum: 0 }
        averageOrderValueUsd: { type: number, minimum: 0 }
        topPaymentMethods:
          type: array
          items:
            type: object
            required: [method, count]
            properties:
              method: { type: string }
              count: { type: number, minimum: 0, multipleOf: 1 }
        topCurrencies:
          type: array
          items:
            type: object
            required: [currency, count]
            properties:
              currency: { type: string }
              count: { type: number, minimum: 0, multipleOf: 1 }
        topTradingPairs:
          type: array
          items:
            type: object
            required: [pair, fromAsset, toAsset, count]
            properties:
              pair: { type: string }
              fromAsset: { type: string }
              toAsset: { type: string }
              count: { type: number, minimum: 0, multipleOf: 1 }
        dailySeries:
          type: array
          items:
            type: object
            required: [date, orders, approximateUsdVolume]
            properties:
              date: { type: string }
              orders: { type: number, minimum: 0, multipleOf: 1 }
              approximateUsdVolume: { type: number, minimum: 0 }
        recentActivity:
          type: array
          items:
            type: object
            required: [id, label, time]
            properties:
              id: { type: string }
              label: { type: string }
              time: { type: string }
        valuation:
          type: object
          required: [observedAt, status, valuedOrders, totalOrders, unavailableCurrencies]
          properties:
            observedAt: { type: ["string", "null"], format: date-time }
            status: { type: string, enum: [complete, partial, unavailable] }
            valuedOrders: { type: number, minimum: 0, multipleOf: 1 }
            totalOrders: { type: number, minimum: 0, multipleOf: 1 }
            unavailableCurrencies:
              type: array
              items: { type: string }
        operationalHealth:
          type: object
          required: [providerFreshness, catalog, quickexReconciliation, unresolvedOrders, notificationsPending, notificationsFailed, oldestPendingNotificationAt]
          properties:
            providerFreshness: { $ref: "#/components/schemas/ProviderFreshness" }
            quickexReconciliation: { $ref: "#/components/schemas/QuickexReconciliationHealth" }
            catalog:
              description: >-
                Quickex instrument catalog freshness for Convert. Swap does not use
                this external catalog and reports ageMs null with stale true.
              type: object
              required: [ageMs, stale, lastFailureAt]
              properties:
                ageMs: { type: [number, "null"], minimum: 0 }
                stale: { type: boolean }
                lastFailureAt: { type: [string, "null"], format: date-time }
            unresolvedOrders: { type: number, minimum: 0, multipleOf: 1 }
            notificationsPending: { type: number, minimum: 0, multipleOf: 1 }
            notificationsFailed: { type: number, minimum: 0, multipleOf: 1 }
            oldestPendingNotificationAt: { type: ["string", "null"] }
