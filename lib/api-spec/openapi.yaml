        name: { type: string }
        precision: { type: number, minimum: 0, maximum: 4, multipleOf: 1 }
        lifecycle: { type: string, enum: [active, restricted, deprecated] }
        regions:
          type: array
          items: { type: string, maxLength: 32 }
        countries:
          type: array
          items: { type: string, pattern: '^[A-Z]{2}$' }
