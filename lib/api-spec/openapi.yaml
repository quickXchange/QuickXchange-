      type: string
      pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
      description: An exact base-10 decimal value. Consumers must not parse this as a binary floating-point number.
    NonNegativeExactDecimal:
      type: string
      pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
      description: An exact non-negative base-10 decimal value.
