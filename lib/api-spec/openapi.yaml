          maxItems: 300
          items: { type: string, pattern: '^[A-Za-z]{2}$' }
        enabled: { type: boolean }
        rateMode: { type: string, enum: [automatic, manual] }
        manualRate: { type: string, nullable: true, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$' }
