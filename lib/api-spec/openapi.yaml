      required: [id, code, name, precision, lifecycle, regions, countries, enabled, rateMode, manualRate, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
