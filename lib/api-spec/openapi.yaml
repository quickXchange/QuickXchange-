        expectedFeeRevenue: { $ref: "#/components/schemas/ExactDecimal" }
        normalizedGrossCustomerVolume: { $ref: "#/components/schemas/ExactDecimal" }
        normalizedExpectedFeeRevenue: { $ref: "#/components/schemas/ExactDecimal" }
    ManualDeskRevenueTotal:
      type: object
      additionalProperties: false
      required: [status, targetAsset, orderCount, grossCustomerVolume, expectedFeeRevenue]
      properties:
        status: { $ref: "#/components/schemas/ManualDeskRevenueStatus" }
        targetAsset: { type: string }
        orderCount: { type: number, minimum: 0, multipleOf: 1 }
        grossCustomerVolume: { $ref: "#/components/schemas/ExactDecimal" }
        expectedFeeRevenue: { $ref: "#/components/schemas/ExactDecimal" }
    ManualDeskRevenueNormalizedTotal:
      type: object
      additionalProperties: false
      required: [status, orderCount, historicalGrossCustomerVolume, historicalExpectedFeeRevenue]
      properties:
        status: { $ref: "#/components/schemas/ManualDeskRevenueStatus" }
        orderCount: { type: number, minimum: 0, multipleOf: 1 }
        historicalGrossCustomerVolume: { $ref: "#/components/schemas/ExactDecimal" }
        historicalExpectedFeeRevenue: { $ref: "#/components/schemas/ExactDecimal" }
    ManualDeskRevenueNormalizationPolicy:
      type: object
      additionalProperties: false
      required: [decimalScale, rounding]
      description: Historical conversions use exact rational arithmetic across all included orders, then are rendered once at the stated decimal scale.
      properties:
        decimalScale: { type: number, enum: [30] }
        rounding:
          type: string
          enum: [truncateAfterAggregation]
          description: Truncate toward zero only after exact rational values have been aggregated.
    ManualDeskRevenueReport:
      type: object
      additionalProperties: false
      required: [from, to, groupBy, reportingCurrency, normalizationPolicy, generatedAt, totals, normalizedTotals, groups]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        groupBy: { type: string, enum: [pricingRule, route] }
        reportingCurrency: { type: string }
        normalizationPolicy: { $ref: "#/components/schemas/ManualDeskRevenueNormalizationPolicy" }
        generatedAt: { type: string, format: date-time }
        totals:
          type: array
          items: { $ref: "#/components/schemas/ManualDeskRevenueTotal" }
        normalizedTotals:
          type: array
          items: { $ref: "#/components/schemas/ManualDeskRevenueNormalizedTotal" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/ManualDeskRevenueBucket" }
