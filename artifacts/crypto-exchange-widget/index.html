    <script>
      (function() {
        var savedTheme = null;
        try {
          var migrationKey = 'qx-preview-parity-v1';
          if (localStorage.getItem(migrationKey) !== 'complete') {
            localStorage.removeItem('qx-theme');
            localStorage.removeItem('qx-locale');
            localStorage.setItem(migrationKey, 'complete');
          }
          savedTheme = localStorage.getItem('qx-theme');
        } catch (e) {}
        var isDark = savedTheme
          ? savedTheme === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
